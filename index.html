<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://image.tmdb.org; font-src 'self'; connect-src 'self' https://api.themoviedb.org; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Rentab'Pass</title>
<style>
:root{
  --bg:#0B0B0C;--card:#17171A;--line:#26262B;--line2:#2A2A30;--deep:#0F0F11;--bar:#111113;
  --txt:#F5F5F2;--mut:#A6A6AD;--acc:#FFC20E;--ink:#0B0B0C;--neg:#FF8A7A;--grey:#6B6B73;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
  --accT:#FFC20E;--track:#2A2A30;--track2:#3A3A40;--soft:#C9C9CF;--soft2:#D6D6DA;--toastBg:#F5F5F2;--toastFg:#0B0B0C;--yearNeg:#2A2A30;
  --disp:'Bebas Neue','sans-serif-condensed','Roboto Condensed',Impact,'Arial Narrow',sans-serif;
}
html{color-scheme:dark}
html[data-theme="light"]{color-scheme:light;
  --bg:#F4F3EF;--card:#FFFFFF;--line:#E4E2DC;--line2:#D6D4CD;--deep:#F1F0EB;--bar:#FFFFFF;
  --txt:#141414;--mut:#5C5C63;--accT:#8A6400;--neg:#B3261E;--grey:#A3A3AA;
  --track:#E6E4DE;--track2:#D6D4CD;--soft:#3D3D44;--soft2:#2E2E33;--toastBg:#1C1C1E;--toastFg:#F5F5F2;--yearNeg:#ECEAE4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:Inter,Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--acc)}
.disp{font-family:var(--disp);font-weight:400;letter-spacing:.02em}
.acc{color:var(--accT)}
.mut{color:var(--mut)}
.app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--bg)}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 20px calc(170px + var(--safe-b));display:flex;flex-direction:column;gap:14px}
.scroll>section,.scroll>div,.scroll>p,.scroll>button{flex-shrink:0}
.top{padding:calc(18px + var(--safe-t)) 20px 10px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.eyebrow{font-size:11px;font-weight:600;color:var(--mut);letter-spacing:.12em;text-transform:uppercase}
.h1{font-size:36px;line-height:1;margin:4px 0 0}
.h2{margin:0;font-size:26px;line-height:1.05}
.ibtn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line2);background:var(--card);display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:16px}
.tile{background:var(--deep);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .k{font-size:11px;color:var(--mut)}
.tile .v{font-size:17px;font-weight:700;white-space:nowrap}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.badge{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px}
.badge.ok{background:var(--acc);color:var(--ink)}
.badge.no{background:var(--track);color:var(--txt)}
.sec-title{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lbl{margin:0;font-size:12px;font-weight:700;color:var(--mut);letter-spacing:.1em;text-transform:uppercase}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;width:100%;text-align:left}
.poster{width:46px;height:64px;border-radius:10px;flex-shrink:0;display:flex;align-items:flex-end;padding:6px;overflow:hidden;background-size:cover;background-position:center}
.poster span,.posterBig span,.pcard .pimg span{font-family:var(--disp);line-height:.9;color:#F5F5F2}
.poster span{font-size:19px}
.posterBig{width:84px;height:122px;border-radius:12px;flex-shrink:0;display:flex;align-items:flex-end;padding:8px;background-size:cover;background-position:center;overflow:hidden}
.posterBig span{font-size:24px}
.chip{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--ink);background:var(--acc);padding:3px 7px;border-radius:6px;white-space:nowrap}
.fab{position:absolute;right:20px;bottom:calc(92px + var(--safe-b));height:56px;padding:0 22px 0 18px;border-radius:28px;background:var(--acc);color:var(--ink);display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;border:none;box-shadow:0 10px 30px rgba(0,0,0,.55);z-index:5}
.fab{transition:opacity .35s ease,transform .35s ease}
.fab.idle{opacity:0;transform:translateY(24px) scale(.92);pointer-events:none}
@media (prefers-reduced-motion:reduce){.fab{transition:none}}
/* le doigt ne fait défiler la page que verticalement : les glissements horizontaux servent à la navigation */
.scroll{touch-action:pan-y;overscroll-behavior:contain}
.chips{touch-action:pan-x}
/* affiche en grand (appui long dans Films) */
.pimg,.poster,.posterBig{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#zoom{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:calc(20px + var(--safe-t)) 20px calc(20px + var(--safe-b));cursor:zoom-out}
#zoom .zi{width:min(92vw,calc((100vh - 120px) * 2 / 3));aspect-ratio:2/3;border-radius:18px;background-size:cover;background-position:center;box-shadow:0 20px 60px rgba(0,0,0,.6);display:flex;align-items:flex-end;padding:20px}
#zoom .zi span{font-family:var(--disp);font-size:56px;line-height:.9;color:#F5F5F2}
#zoom .zt{position:absolute;left:0;right:0;bottom:calc(18px + var(--safe-b));text-align:center;color:#F5F5F2;font-size:15px;font-weight:600;padding:0 20px}
.nav{position:absolute;left:0;right:0;bottom:0;padding-bottom:calc(8px + var(--safe-b));height:calc(76px + var(--safe-b));background:var(--bar);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));z-index:6}
.nav button{background:none;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--mut);font-size:11px;font-weight:600;padding:0}
.nav button[aria-current="page"]{color:var(--accT)}
.btn{height:54px;border-radius:16px;border:none;background:var(--acc);color:var(--ink);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line2);font-weight:600}
.btn.danger{background:transparent;color:var(--neg);border:1px solid #4A2A28}
.btn.sm{height:46px;font-size:14px;border-radius:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12px;color:var(--mut)}
.inp{height:46px;border-radius:12px;border:1px solid var(--line2);background:var(--card);color:var(--txt);padding:0 12px;font-size:16px;width:100%;min-width:0}
.inp::placeholder{color:#8A8A92}
html[data-theme="light"] .inp::placeholder{color:#7A7A82}
.inp:focus{outline:2px solid var(--acc);outline-offset:1px}

.techs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tech{min-height:52px;border-radius:14px;border:1px solid var(--line2);background:var(--card);font-size:14px;font-weight:700;padding:4px}
.tech[aria-pressed="true"]{background:var(--acc);color:var(--ink);border-color:var(--acc)}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line2);background:var(--deep);font-size:20px}
.stepper button.plus{background:var(--acc);color:var(--ink);border:none;font-weight:700}
.stepper .n{width:36px;text-align:center;font-size:30px}
.foot{position:absolute;left:0;right:0;bottom:0;background:var(--bar);border-top:1px solid var(--line);padding:14px 20px calc(18px + var(--safe-b));display:flex;flex-direction:column;gap:12px;z-index:6}
.sugg{display:flex;flex-direction:column;gap:6px}
.sugg button{display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 10px;border-radius:12px;border:1px solid var(--line2);background:var(--deep);font-size:14px;text-align:left;width:100%}
.sugg .thumb{width:30px;height:44px;border-radius:6px;background-size:cover;background-position:center;flex-shrink:0;background-color:var(--track)}
.list{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.row{min-height:60px;display:flex;align-items:center;gap:10px;padding:0 14px 0 16px;border:none;background:transparent;width:100%;text-align:left}
.row+.row{border-top:1px solid var(--line)}
.note{margin:0;display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.45;color:var(--soft);background:var(--bar);border:1px dashed var(--track2);border-radius:14px;padding:12px 14px}
.warn{border-color:#5A4A1A;background:#1A160A}
html[data-theme="light"] .warn{border-color:#D9C27A;background:#FFF8E0}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.62);display:flex;flex-direction:column;justify-content:flex-end;z-index:20}
.scrim>.close-area{flex:1;background:none;border:none}
.sheet{background:var(--card);border-top:1px solid var(--line2);border-radius:28px 28px 0 0;padding:10px 20px calc(22px + var(--safe-b));display:flex;flex-direction:column;gap:16px;max-height:92dvh;overflow-y:auto}
.handle{align-self:center;width:40px;height:5px;border-radius:3px;background:var(--track2);flex-shrink:0}
.chips{flex-shrink:0;display:flex;gap:6px;overflow-x:auto;margin:0 -20px;padding:0 20px 2px;scrollbar-width:none}
.pill{flex-shrink:0;height:40px;padding:0 14px;border-radius:20px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;white-space:nowrap;background:var(--deep);border:1px solid var(--line2)}
.pill[aria-selected="true"],.pill[aria-pressed="true"]{background:var(--acc);color:var(--ink);border-color:var(--acc)}
.seg{display:grid;gap:4px;background:var(--deep);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{height:40px;border-radius:10px;border:none;background:transparent;font-size:13px;font-weight:700;color:var(--mut)}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--ink)}
.dot{width:7px;height:7px;border-radius:4px;background:var(--acc)}
.pill[aria-selected="true"] .dot{background:var(--ink)}
.bigprice{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--deep);border-radius:18px;padding:8px}
.bigprice>button{width:52px;height:52px;flex-shrink:0;border-radius:14px;border:1px solid var(--line2);background:var(--card);font-size:22px}
.bigprice>button.plus{background:var(--acc);color:var(--ink);border:none;font-weight:700}
.pricebox{flex:1;min-width:0;height:60px;display:flex;align-items:center;justify-content:center;gap:4px;border-radius:14px;border:1px dashed var(--track2)}
.pricebox input{width:120px;background:transparent;border:none;outline:none;text-align:right;font-family:var(--disp);font-size:50px;line-height:1;color:var(--accT);padding:0}
.tl{display:flex;flex-direction:column;background:var(--deep);border-radius:16px;padding:14px}
.tl-i{display:flex;gap:12px;align-items:stretch}
.tl-d{display:flex;flex-direction:column;align-items:center;width:12px}
.tl-d i{width:12px;height:12px;border-radius:6px;border:2px solid var(--mut);margin-top:3px;flex-shrink:0}
.tl-d i.f{background:var(--acc);border-color:var(--acc)}
.tl-d b{flex:1;width:2px;background:var(--track2)}
.tl-i:last-child .tl-d b{background:transparent}
.tl-c{flex:1;display:flex;justify-content:space-between;gap:8px;padding-bottom:12px;align-items:flex-start}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(160px + var(--safe-b));background:var(--toastBg);color:var(--toastFg);font-weight:600;font-size:14px;padding:12px 16px;border-radius:14px;z-index:30;max-width:88%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.banner{margin:0 20px 6px;font-size:12px;color:var(--soft);background:var(--bar);border:1px solid var(--line);border-radius:12px;padding:8px 12px;display:flex;gap:8px;align-items:center}
.hbar{height:10px;border-radius:5px;background:var(--track);overflow:hidden}
.hbar>i{display:block;height:100%;background:var(--acc);border-radius:5px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.empty{text-align:center;color:var(--mut);font-size:14px;padding:26px 14px;border:1px dashed var(--track2);border-radius:18px;display:flex;flex-direction:column;gap:12px;align-items:center;line-height:1.45}
textarea.inp{height:160px;padding:10px;font-size:12px;font-family:ui-monospace,monospace;resize:none}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pcard{background:none;border:none;padding:0;display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0}
.pcard .pimg{position:relative;width:100%;aspect-ratio:2/3;border-radius:12px;background-size:cover;background-position:center;display:flex;align-items:flex-end;padding:8px;overflow:hidden;border:1px solid var(--line)}
.pcard .pimg span{font-size:20px}
.pcard .pt{font-size:13px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard .ps{font-size:11px;color:var(--mut)}
.seen{position:absolute;top:6px;right:6px;background:var(--acc);color:var(--ink);font-size:10px;font-weight:800;padding:3px 6px;border-radius:6px;font-family:Inter,sans-serif}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mgrid button{min-height:58px;border-radius:14px;border:1px solid var(--line2);background:var(--deep);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:600}
.mgrid button span{font-size:11px;color:var(--mut);font-weight:500}
.duo{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 14px;border-radius:16px;border:1px solid var(--line);background:var(--card);width:100%;font-size:14px}
.sw{width:44px;height:26px;border-radius:13px;background:var(--track2);position:relative;flex-shrink:0;transition:background .2s}
.sw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:10px;background:#F5F5F2;transition:transform .2s}
.duo[aria-pressed="true"] .sw{background:var(--acc)}
.duo[aria-pressed="true"] .sw i{transform:translateX(18px);background:var(--ink)}
.arow{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px 6px 8px 8px}
.arow>.am{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:none;border:none;padding:0;text-align:left}
.star{width:44px;height:44px;border-radius:22px;border:none;background:transparent;color:var(--mut);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.star[aria-pressed="true"]{color:var(--accT)}
.wbadge{position:absolute;top:6px;left:6px;width:22px;height:22px;border-radius:11px;background:rgba(11,11,12,.8);color:var(--acc);display:flex;align-items:center;justify-content:center}
.daychip{width:46px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;background:var(--deep);padding:6px 0;line-height:1.05}
.daychip b{font-family:var(--disp);font-size:24px;font-weight:400;color:var(--accT)}
.daychip span{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
/* écran de démarrage */
#splash{position:fixed;inset:0;z-index:100;background:#0B0B0C;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;overflow:hidden;transition:opacity .5s ease,transform .5s ease}
#splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
#splash .beam{position:absolute;left:50%;top:-12%;width:160vmax;height:120vh;transform:translateX(-50%);background:conic-gradient(from 180deg at 50% 0%,transparent 0deg,transparent 166deg,rgba(255,194,14,.07) 172deg,rgba(255,194,14,.16) 180deg,rgba(255,194,14,.07) 188deg,transparent 194deg,transparent 360deg);animation:beam 2.2s ease-in-out both}
#splash .tk{position:relative;animation:pop .7s cubic-bezier(.2,1.4,.4,1) .15s both}
#splash .tk path.ck{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .45s ease-out .8s forwards}
#splash .ttl{position:relative;font-family:var(--disp);font-size:min(50px,11.5vw);letter-spacing:.04em;white-space:nowrap;color:#F5F5F2;display:flex}
#splash .ttl span{display:inline-block;animation:rise .5s ease-out both}
#splash .sub{position:relative;font-size:14px;color:#A6A6AD;min-height:20px;animation:fade .6s ease-out 1s both}
#splash .sub b{color:var(--acc);font-weight:700}
#splash .strip{position:absolute;bottom:calc(46px + var(--safe-b));left:0;width:200%;height:30px;background:#141416;border-top:1px solid #222;border-bottom:1px solid #222;display:flex;align-items:center;animation:roll 2.4s linear infinite}
#splash .strip::before{content:"";width:100%;height:10px;background:repeating-linear-gradient(90deg,transparent 0 10px,#2E2E34 10px 22px)}
#splash .ver{position:absolute;bottom:calc(92px + var(--safe-b));left:0;right:0;text-align:center;font-size:12px;line-height:1.6;color:#6B6B73;animation:fade .6s ease-out 1.4s both}
#splash .ver b{color:#A6A6AD;font-weight:600}
#splash .skip{position:absolute;top:calc(14px + var(--safe-t));right:16px;background:none;border:none;color:#6B6B73;font-size:12px;min-height:44px;padding:0 10px}
@keyframes beam{0%{opacity:0}40%{opacity:1}55%{opacity:.75}70%{opacity:1}100%{opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(.4) rotate(-14deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes rise{0%{opacity:0;transform:translateY(18px)}100%{opacity:1;transform:none}}
@keyframes fade{0%{opacity:0}100%{opacity:1}}
@keyframes roll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){#splash *,#splash{animation:none!important;transition:none!important}#splash .tk path.ck{stroke-dashoffset:0}}
</style>
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="stylesheet" href="web.css">
<link rel="stylesheet" href="desktop.css">
</head>
<body>
<div id="splash" role="presentation">
  <div class="beam"></div>
  <button class="skip" id="splashskip">Passer</button>
  <svg class="tk" width="132" height="92" viewBox="0 0 132 92" aria-hidden="true"><path fill="#FFC20E" d="M12 4h108a8 8 0 0 1 8 8v20a14 14 0 0 0 0 28v20a8 8 0 0 1-8 8H12a8 8 0 0 1-8-8V60a14 14 0 0 0 0-28V12a8 8 0 0 1 8-8z"/><path stroke="#0B0B0C" stroke-width="3" stroke-dasharray="5 5" d="M94 10v72"/><path class="ck" fill="none" stroke="#0B0B0C" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M30 47l13 13 25-27"/></svg>
  <div class="ttl" aria-label="Rentab’Pass"></div>
  <div class="sub" id="splashsub"></div>
  <div class="ver" id="splashver"></div>
  <div class="strip" aria-hidden="true"></div>
</div>
<div class="app" id="app">
  <div id="banner"></div>
  <div id="view" style="flex:1;display:flex;flex-direction:column;min-height:0"></div>
  <div id="layer"></div>
  <div id="toast" role="status" aria-live="polite"></div>
</div>
<script src="app.js"></script>
<script src="desktop.js"></script>
</body>
</html>
